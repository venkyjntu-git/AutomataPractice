<svg width="250" height="150" viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Tape -->
  <rect x="20" y="10" width="210" height="30" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <text x="25" y="30" font-size="14" fill="#374151">0 1 1 0 _ _</text>
  
  <!-- States -->
  <circle cx="60" cy="100" r="20" stroke="#F59E0B" stroke-width="3" fill="#FEF3C7"/>
  <circle cx="140" cy="50" r="20" stroke="#F59E0B" stroke-width="3" fill="#FEF3C7"/>
  <circle cx="140" cy="140" r="20" stroke="#F59E0B" stroke-width="3" fill="#FDE68A"/>
  
  <!-- Accepting state double circle -->
  <circle cx="140" cy="140" r="16" stroke="#F59E0B" stroke-width="2" fill="none"/>
  
  <!-- Start arrow -->
  <path d="M30 100 L40 100" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Transitions -->
  <path d="M80 100 Q120 50 130 50" stroke="#10B981" fill="transparent" marker-end="url(#arrowhead)"/>
  <text x="100" y="70" font-size="12" fill="#10B981">0→1,R</text>
  
  <path d="M80 100 Q120 140 130 140" stroke="#3B82F6" fill="transparent" marker-end="url(#arrowhead)"/>
  <text x="100" y="130" font-size="12" fill="#3B82F6">1→0,L</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>
</svg>